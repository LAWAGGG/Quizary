# Teruskan skema asli (https) dari cloudflared/CDN ke backend agar
# file_url() hasilkan URL https — tanpa ini URL file jadi http dan
# diblokir browser sebagai mixed-content di halaman https.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name localhost;

    # Izinkan upload hingga 10 MB (docx, gambar/audio soal & opsi).
    # Default nginx 1m → 413 Request Entity Too Large untuk file soal >1 MB.
    client_max_body_size 10M;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        # AI generate bisa 1-2 menit: jangan putus duluan (default 60s).
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        # SSE /ai/generate/stream: matikan buffer agar event flush real-time.
        proxy_buffering off;
        proxy_cache off;
    }

    location /uploads/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_cache off;
        expires 7d;
        add_header Cache-Control "public, immutable" always;
    }
}
